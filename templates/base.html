<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Roya — Personal Finance{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --border:#2a2e3a; --text:#e6e8eb; --muted:#9aa0b0; --accent:#6ee7b7; --accent2:#60a5fa; --danger:#f87171; --income:#34d399; --expense:#f87171; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
    a{color:var(--accent2);text-decoration:none} a:hover{text-decoration:underline}
    .container{max-width:1080px;margin:0 auto;padding:24px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
    header h1{font-size:28px;margin:0;letter-spacing:-0.02em}
    header h1 span{color:var(--accent)}
    .badge{padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr 360px;gap:24px}
    @media(max-width:900px){.grid{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
    .card h2{margin:0 0 12px 0;font-size:18px}
    .stat{font-size:32px;font-weight:700}
    .muted{color:var(--muted);font-size:13px}
    .account-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:#151821;transition:border-color .15s}
    .account-row:hover{border-color:var(--accent2)}
    .account-name{font-weight:600}
    .balance{font-weight:700;font-variant-numeric:tabular-nums}
    .balance.positive{color:var(--income)} .balance.negative{color:var(--danger)}
    form{display:flex;flex-direction:column;gap:10px}
    label{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
    input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:#0f1115;color:var(--text);font-size:14px}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2)}
    button{padding:10px 14px;border-radius:10px;border:none;background:var(--accent);color:#0a0f0d;font-weight:700;cursor:pointer}
    button.secondary{background:var(--accent2);color:white}
    button.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
    button:hover{opacity:.9}
    button:disabled{opacity:.5;cursor:not-allowed}
    .row{display:flex;gap:10px} .row>*{flex:1}
    .tx{padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#151821;display:flex;justify-content:space-between;align-items:center}
    .tx-left{display:flex;flex-direction:column}
    .tx-amount{font-weight:700;font-variant-numeric:tabular-nums}
    .tx-amount.income{color:var(--income)} .tx-amount.expense{color:var(--expense)}
    .pill{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .pill.income{background:rgba(52,211,153,.15);color:var(--income);border:1px solid rgba(52,211,153,.3)}
    .pill.expense{background:rgba(248,113,113,.12);color:var(--expense);border:1px solid rgba(248,113,113,.3)}
    .flash{padding:10px 12px;border-radius:10px;margin-bottom:12px;font-size:13px}
    .flash.error{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:var(--danger)}
    .flash.success{background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.3);color:var(--income)}
    .htmx-indicator{opacity:0;transition:opacity .2s} .htmx-request .htmx-indicator{opacity:1}
    .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .toolbar input,.toolbar select{flex:1;min-width:120px}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="container">
    <header>
      <h1><a href="/" style="color:inherit;text-decoration:none">roya <span>◆</span></a></h1>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="badge">local • SQLite • HTMX</span>
        <a class="badge" href="/api/accounts" target="_blank">REST API</a>
      </div>
    </header>
    {% block content %}{% endblock %}
  </div>
  <script>
    document.body.addEventListener('htmx:responseError', function(evt){
      try { let r=JSON.parse(evt.detail.xhr.responseText); alert(r.error||evt.detail.xhr.responseText);} catch(e){ alert(evt.detail.xhr.responseText); }
    });
    document.body.addEventListener('transaction-created', function(){ htmx.trigger('#account-list','refresh'); });
    document.body.addEventListener('transaction-deleted', function(){ htmx.trigger('#account-list','refresh'); });
  </script>
</body>
</html>
