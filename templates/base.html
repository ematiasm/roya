<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Roya — Personal Finance{% endblock %}</title>
  <link rel="stylesheet" href="/static/tailwind.css" />
  <script src="/static/htmx.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body class="bg-bg font-sans text-text">
  <div class="mx-auto max-w-[1080px] px-6 py-6">
    <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
      <h1 class="m-0 text-[28px] font-bold tracking-[-0.02em]"><a href="/" class="text-inherit no-underline hover:no-underline">roya <span class="text-accent">◆</span></a></h1>
      <nav class="flex flex-wrap items-center gap-2">
        <a class="rounded-full border border-border bg-card px-2.5 py-1 text-[13px] text-muted" href="/">Dashboard</a>
        <a class="rounded-full border border-border bg-card px-2.5 py-1 text-[13px] text-muted" href="/products">Products</a>
        <a class="rounded-full border border-border bg-card px-2.5 py-1 text-[13px] text-muted" href="/sales">Sales</a>
        <span class="rounded-full border border-border bg-card px-2.5 py-1 text-[13px] text-muted">local • SQLite • HTMX</span>
        <a class="rounded-full border border-border bg-card px-2.5 py-1 text-[13px] text-muted" href="/api/accounts" target="_blank">REST API</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>
  <script>
    document.body.addEventListener('htmx:responseError', function(evt){
      try { let r=JSON.parse(evt.detail.xhr.responseText); alert(r.error||evt.detail.xhr.responseText);} catch(e){ alert(evt.detail.xhr.responseText); }
    });
    document.body.addEventListener('transaction-created', function(){ htmx.trigger('#account-list','refresh'); });
    document.body.addEventListener('transaction-deleted', function(){ htmx.trigger('#account-list','refresh'); });
  </script>
</body>
</html>
