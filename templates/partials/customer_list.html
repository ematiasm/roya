<div id="customer-list-inner">
  {% if let Some(w) = warning %}
    <div class="mb-3 rounded-[10px] border border-danger/30 bg-danger/12 px-3 py-2.5 text-[13px] text-danger">{{ w }}</div>
  {% endif %}
  {% if customers.is_empty() %}
    <div class="empty">{{ localization.tr(crate::localization::MessageKey::CustomerNoCustomers) }}</div>
  {% else %}
    <div class="flex flex-col gap-1.5">
      {% for r in customers %}
      <div class="flex items-center gap-2 rounded-[10px] border border-border bg-surface px-3.5 py-2.5 hover:border-accent2">
        <button type="button"
                class="btn-plain min-w-0 flex-1 truncate {% if r.customer.is_active %}text-text{% else %}text-muted{% endif %}"
                hx-get="/web/customers/detail/{{ r.customer.id }}"
                hx-target="#customer-drawer-body"
                hx-swap="innerHTML">{{ r.customer.name }}</button>
        <button type="button"
                class="btn-secondary shrink-0"
                title="{{ localization.tr(crate::localization::MessageKey::CommonEdit) }}"
                aria-label="{{ localization.tr(crate::localization::MessageKey::CommonEdit) }}"
                hx-get="/web/customers/edit-form/{{ r.customer.id }}"
                hx-target="#customer-edit-dialog-body"
                hx-swap="innerHTML"
                hx-on::after-request="if(event.detail.successful) document.getElementById('customer-edit-dialog').showModal()">✎</button>
      </div>
      {% endfor %}
    </div>
  {% endif %}
</div>
