<div class="mb-3 flex items-center justify-between gap-6">
  <h2 class="text-lg font-semibold">{{ localization.tr(crate::localization::MessageKey::NavigationRoles) }} — {{ user.user.username }}</h2>
  <button type="button" class="btn-secondary" onclick="document.getElementById('user-edit-dialog').close()" aria-label="{{ localization.tr(crate::localization::MessageKey::AccessibilityDismiss) }}">✕</button>
</div>
<form class="flex flex-col gap-2.5"
      data-action="{{ localization.tr(crate::localization::MessageKey::IdentityAssignRoles) }}"
      hx-post="/web/users/roles"
      hx-target="#user-list"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful) document.getElementById('user-edit-dialog').close()">
  <input type="hidden" name="user_id" value="{{ user.user.id }}" class="field" />
  <div class="flex flex-col gap-1.5">
    {% for role in roles %}
    <label class="choice rounded-[10px] border border-border bg-surface px-3 py-2 text-sm">
      <input type="checkbox" name="role_ids" value="{{ role.id }}"
             {% for held in user.roles %}{% if held.id == role.id %}checked{% endif %}{% endfor %} />
      <span class="font-semibold">{{ localization.seeded_role_display_name(role.code.as_str(), role.name.as_str()) }}</span>
      <span class="text-[12px] text-muted">{{ role.code }}</span>
      {% if role.is_system %}
      <span class="rounded-full border border-border bg-card px-2 py-0.5 text-[11px] text-muted">{{ localization.tr(crate::localization::MessageKey::IdentityProtected) }}</span>
      {% endif %}
    </label>
    {% endfor %}
  </div>
  <button type="submit" class="btn-primary">{{ localization.tr(crate::localization::MessageKey::IdentitySaveRoles) }}</button>
</form>
