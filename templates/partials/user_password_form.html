<div class="mb-3 flex items-center justify-between gap-6">
  <h2 class="text-lg font-semibold">{{ localization.tr(crate::localization::MessageKey::IdentityNewPassword) }} — {{ user.user.username }}</h2>
  <button type="button" class="btn-secondary" onclick="document.getElementById('user-edit-dialog').close()" aria-label="{{ localization.tr(crate::localization::MessageKey::AccessibilityDismiss) }}">✕</button>
</div>
<form class="flex flex-col gap-2.5"
      data-action="{{ localization.tr(crate::localization::MessageKey::IdentityNewPassword) }}"
      hx-post="/web/users/password"
      hx-target="#user-list"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful) document.getElementById('user-edit-dialog').close()">
  <input type="hidden" name="user_id" value="{{ user.user.id }}" class="field" />
  <div>
    <label class="field-label">{{ localization.tr(crate::localization::MessageKey::IdentityTemporaryPassword) }}</label>
    <input type="password" name="new_password" required minlength="12" autocomplete="new-password" class="field" />
  </div>
  <button type="submit" class="btn-primary">{{ localization.tr(crate::localization::MessageKey::IdentitySaveTemporaryPassword) }}</button>
  <div class="text-[13px] text-muted">{{ localization.tr(crate::localization::MessageKey::IdentityTemporaryPasswordHelp) }}</div>
</form>
