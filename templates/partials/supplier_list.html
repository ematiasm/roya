<div id="supplier-list-inner">
  {% if suppliers.is_empty() %}
    <div class="rounded-xl border border-dashed border-border p-4 text-center text-[13px] text-muted">No suppliers yet — use New supplier above.</div>
  {% else %}
    <div class="flex flex-col gap-1.5">
      {% for v in suppliers %}
      <div class="flex items-center gap-2 rounded-[10px] border border-border bg-surface px-3.5 py-2.5 hover:border-accent2">
        <button type="button"
                class="btn-plain min-w-0 flex-1 truncate {% if v.supplier.is_active %}text-text{% else %}text-muted{% endif %}"
                hx-get="/web/suppliers/{{ v.supplier.id }}/detail"
                hx-target="#supplier-drawer-body"
                hx-swap="innerHTML">{{ v.supplier.name }}</button>
        <button type="button"
                class="btn-secondary shrink-0"
                title="Edit"
                aria-label="Edit"
                hx-get="/web/suppliers/{{ v.supplier.id }}/edit-form"
                hx-target="#supplier-edit-dialog-body"
                hx-swap="innerHTML"
                hx-on::after-request="if(event.detail.successful) document.getElementById('supplier-edit-dialog').showModal()">✎</button>
      </div>
      {% endfor %}
    </div>
  {% endif %}
</div>
