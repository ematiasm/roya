<div>
  <div class="muted" style="margin-bottom:10px">Total: <span style="font-weight:700;color:var(--text)">${{ total_balance }}</span> across {{ accounts.len() }} accounts</div>
  {% if accounts.is_empty() %}
    <div class="muted" style="padding:16px;text-align:center;border:1px dashed var(--border);border-radius:12px">No accounts yet — create one on the right.</div>
  {% else %}
    {% for acc in accounts %}
    <a href="/accounts/{{ acc.id }}" style="text-decoration:none;color:inherit">
      <div class="account-row">
        <div>
          <div class="account-name">{{ acc.name }}</div>
          <div class="muted">#{{ acc.id }} • {{ acc.created_at.format("%Y-%m-%d") }}</div>
        </div>
        <div class="balance {% if acc.is_negative() %}negative{% else %}positive{% endif %}">${{ acc.balance }}</div>
      </div>
    </a>
    {% endfor %}
  {% endif %}
</div>
