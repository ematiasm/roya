<div class="mb-3 flex items-center justify-between gap-6">
  <h2 class="text-lg font-semibold">Edit customer</h2>
  <button type="button" class="btn-secondary" onclick="document.getElementById('customer-edit-dialog').close()">✕</button>
</div>
<form class="flex flex-col gap-2.5"
      hx-post="/web/customers/edit"
      hx-target="#customer-list"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful) document.getElementById('customer-edit-dialog').close()">
  <input type="hidden" name="customer_id" value="{{ customer.id }}" />
  <div>
    <label>Name</label>
    <input type="text" name="name" required maxlength="128" value="{{ customer.name }}" />
  </div>
  <div class="flex gap-2.5 [&>*]:flex-1">
    <div>
      <label>Phone (optional)</label>
      <input type="text" name="phone" maxlength="32" value="{% if let Some(phone) = customer.phone %}{{ phone }}{% endif %}" />
    </div>
    <div>
      <label>Tax ID (optional)</label>
      <input type="text" name="tax_id" maxlength="32" value="{% if let Some(tax_id) = customer.tax_id %}{{ tax_id }}{% endif %}" />
    </div>
  </div>
  <div>
    <label>Address (optional)</label>
    <input type="text" name="address" maxlength="256" value="{% if let Some(address) = customer.address %}{{ address }}{% endif %}" />
  </div>
  <div class="flex gap-2.5 [&>*]:flex-1">
    <div>
      <label>Credit limit (empty = no limit)</label>
      <input type="number" name="credit_limit" step="0.01" min="0" placeholder="unlimited" value="{% if let Some(limit) = customer.credit_limit %}{{ limit }}{% endif %}" />
    </div>
    <div>
      <label>Payment days (empty = no term)</label>
      <input type="number" name="payment_days" min="0" placeholder="30" value="{% if let Some(days) = customer.payment_days %}{{ days }}{% endif %}" />
    </div>
  </div>
  <div>
    <label>Notes (optional)</label>
    <input type="text" name="notes" maxlength="512" value="{% if let Some(notes) = customer.notes %}{{ notes }}{% endif %}" />
  </div>
  <button type="submit" class="btn-primary">Save Changes</button>
</form>
